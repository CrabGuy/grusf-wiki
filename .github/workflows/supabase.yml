# Applies database migrations and deploys the edge functions when supabase/ changes.
# Optional: without these settings the job is skipped and you deploy from your PC
# with `npm run deploy:backend`.
#   variable SUPABASE_PROJECT_REF   the project ref (the `<ref>` in <ref>.supabase.co)
#   secret   SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens
#   secret   SUPABASE_DB_PASSWORD   the database password chosen at project creation
name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: npx supabase db push
      - run: npx supabase functions deploy --use-api --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
